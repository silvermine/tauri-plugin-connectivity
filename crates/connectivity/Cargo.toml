[package]
name = "connectivity"
version = "0.1.0"
description = "Cross-platform desktop network connectivity detection"
license = "MIT"
edition = "2024"
rust-version = "1.94.0"
repository = "https://github.com/silvermine/tauri-plugin-connectivity"
readme = "README.md"
keywords = ["network", "connectivity", "desktop"]
categories = ["network-programming", "os"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
tracing = { version = "0.1.41", default-features = false, features = ["std", "log"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Networking_Connectivity", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "6.2.1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
zruntime = "0.2.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"

[dev-dependencies]
rstest = { version = "0.28.0", default-features = false }
serde_json = "1.0.140"
