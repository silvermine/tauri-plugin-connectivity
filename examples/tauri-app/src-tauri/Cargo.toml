[package]
name = "tauri-app"
version = "0.1.0"
description = "Connectivity example app"
edition = "2024"
rust-version = "1.94.0"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
tauri-plugin-connectivity = { path = "../../../" }
tracing = { version = "0.1.41", features = ["release_max_level_warn"] }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
