name: CI

on:
   push:
   pull_request:
      branches: [ "master" ]
   workflow_dispatch:

permissions:
   contents: read

defaults:
   run:
      shell: bash

concurrency:
   group: ci-${{ github.event.pull_request.number || github.ref }}
   cancel-in-progress: true

jobs:
   dependencies:
      name: Dependencies
      uses: ./.github/workflows/dependencies.yml

   checks:
      name: Checks
      uses: ./.github/workflows/ci-checks.yml

   rust:
      name: Rust (${{ matrix.platform }})
      strategy:
         fail-fast: false
         matrix:
            include:
               - platform: Linux
                 runner: ubuntu-24.04
               - platform: Windows
                 runner: windows-2025
               - platform: macOS
                 runner: macos-15
      uses: ./.github/workflows/ci-rust.yml
      with:
         runner: ${{ matrix.runner }}

   android:
      name: Android
      uses: ./.github/workflows/ci-android.yml
      with:
         package: tauri-plugin-connectivity
         test-args: ':lib:test'
         sdk-packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
         min-sdk: 23

   ios:
      name: iOS
      uses: ./.github/workflows/ci-ios.yml
      with:
         swift-package: ios/ConnectivityCore
         rust-target: aarch64-apple-ios
         cargo-args: -p tauri-plugin-connectivity

   ci:
      name: Continuous Integration
      if: ${{ always() }}
      needs: [dependencies, checks, rust, android, ios]
      runs-on: ubuntu-24.04
      timeout-minutes: 5
      steps:
         - name: Require every job to succeed
           env:
              JOB_RESULTS: ${{ toJSON(needs) }}
           run: |
              jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$JOB_RESULTS"
              jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$JOB_RESULTS"
