name: CI

on:
   push: # Runs on push to any branch
   pull_request:
      branches: [ "master" ]

env:
   CARGO_TERM_COLOR: always

jobs:
   swift-tests:
      name: Swift Tests
      runs-on: macos-15

      steps:
         - name: Checkout repository
           uses: actions/checkout@v4

         - name: Run Swift tests
           run: swift test --package-path ios/ConnectivityCore

   kotlin-tests:
      name: Kotlin Tests
      runs-on: ubuntu-latest

      steps:
         - name: Checkout repository
           uses: actions/checkout@v4

         - name: Setup Java
           uses: actions/setup-java@v4
           with:
              distribution: 'temurin'
              java-version: '17'
              cache: 'gradle'

         - name: Run Kotlin tests
           working-directory: android
           run: ./gradlew :lib:test


   android-plugin-build:
      name: Android Plugin Build
      runs-on: ubuntu-latest

      steps:
         - name: Checkout repository
           uses: actions/checkout@v4

         - name: Setup Java
           uses: actions/setup-java@v4
           with:
              distribution: 'temurin'
              java-version: '17'
              cache: 'gradle'

         - name: Setup Android SDK
           uses: android-actions/setup-android@v3
           with:
              # v3 default is `tools platform-tools`; Google removed `tools` from the SDK repo.
              packages: 'platform-tools'

         - name: Setup Rust toolchain
           uses: actions-rust-lang/setup-rust-toolchain@v1
           with:
              toolchain: '1.94.0'
              target: aarch64-linux-android
              cache: true

         - name: Add Android target
           run: rustup target add aarch64-linux-android

         - name: Populate android/.tauri/tauri-api
           run: cargo build -p tauri-plugin-fs-resolver --target aarch64-linux-android

         - name: Assemble plugin AAR
           working-directory: android
           run: ./gradlew assembleDebug

   desktop-rust-tests:
      name: Rust Tests (${{ matrix.platform }})
      strategy:
         fail-fast: false
         matrix:
            include:
               - platform: Windows
                 os: windows-2025
               - platform: macOS
                 os: macos-15
      runs-on: ${{ matrix.os }}

      steps:
         - name: Checkout repository
           uses: actions/checkout@v4

         - name: Setup Rust toolchain
           uses: actions-rust-lang/setup-rust-toolchain@v1
           with:
              toolchain: '1.94.0'
              cache: true

         - name: Run Rust tests
           run: cargo test --workspace --lib

   ci:
      name: Continuous Integration
      runs-on: ubuntu-latest

      steps:
         - name: Checkout repository
           uses: actions/checkout@v4
           with:
              fetch-depth: 0

         - name: Setup Node.js
           uses: actions/setup-node@v4
           with:
              node-version-file: '.nvmrc'
              cache: 'npm'

         - name: Install system dependencies
           run: |
              sudo apt-get update
              sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

         - name: Setup Rust toolchain
           uses: actions-rust-lang/setup-rust-toolchain@v1
           with:
              toolchain: '1.94.0'
              components: rustfmt, clippy
              cache: true

         - name: Install npm dependencies
           run: npm ci

         - name: Run standards checks
           run: |
             # Determine commitlint range
             if [ "${{ github.event_name }}" = "pull_request" ]; then
                export COMMITLINT_FROM="${{ github.event.pull_request.base.sha }}"
             else
                # For pushes, verify the before commit exists
                if git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
                   export COMMITLINT_FROM="${{ github.event.before }}"
                else
                   # Fallback: check only HEAD commit on force push or first push
                   export COMMITLINT_FROM="HEAD~1"
                fi
             fi
             npm run standards

         - name: Run cargo check
           run: cargo check --workspace --all-targets

         - name: Run TypeScript and Rust tests
           run: npm test
